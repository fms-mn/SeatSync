name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seatsync
          POSTGRES_PASSWORD: seatsync
          POSTGRES_DB: seatsync_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seatsync"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://seatsync:seatsync@localhost:5432/seatsync_test?schema=public
      DIRECT_URL: postgresql://seatsync:seatsync@localhost:5432/seatsync_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      CLIENT_URL: http://localhost:5173
      VITE_API_URL: http://localhost:4000
      ADMIN_SEED_PASSWORD: ci-development-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seatsync
          POSTGRES_PASSWORD: seatsync
          POSTGRES_DB: seatsync
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seatsync"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://seatsync:seatsync@localhost:5432/seatsync?schema=public
      DIRECT_URL: postgresql://seatsync:seatsync@localhost:5432/seatsync?schema=public
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      CLIENT_URL: http://localhost:5173
      VITE_API_URL: http://localhost:4000
      ADMIN_SEED_PASSWORD: ci-development-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
